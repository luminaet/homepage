<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMINA PROJECT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=Poppins:wght@500;700;800&amp;family=Sora:wght@500;700;800&amp;family=Playfair+Display:wght@500;700;800&amp;display=swap">
<style id="css">
/* Tema tunggal terang (putih dan merah), tidak mengikuti mode gelap perangkat. Layout: halaman putih dengan aksen merah. Kolom isi di kiri, panel peta + kontak + pesan menempel di kanan; panel turun ke bawah di ponsel. Semua warna turunan dihitung dari satu warna merah (--brand) agar admin bisa menggantinya tanpa warna yang bentrok. */
:root{
  --brand:#D90429;
  --red:var(--brand);
  --deep:color-mix(in srgb,var(--brand) 62%,#000);
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#2B1014; --muted:#7A5A60;
  --line:color-mix(in srgb,var(--brand) 16%,#fff);
  --blush:color-mix(in srgb,var(--brand) 6%,#fff);
  --red-soft:color-mix(in srgb,var(--brand) 16%,#fff);
  --red-ink:#FFFFFF; --block:var(--brand); --on-block:#FFFFFF;
  --chip:var(--deep); --chip-ink:#FFFFFF;
  --rad:20px; --rad-btn:14px;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(520px 360px at 100% 0%,color-mix(in srgb,var(--brand) 13%,transparent),transparent 70%),radial-gradient(420px 320px at 0% 38%,color-mix(in srgb,var(--brand) 7%,transparent),transparent 70%);
  background-repeat:no-repeat;
  color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body.noglow{background-image:none}
h1,h2,h3{font-family:var(--font-display);line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
/* banner */
.banner{background:var(--deep);color:#fff;text-align:center;font-weight:500;font-size:14px;padding:9px 16px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-bottom:0}
.banner.dim,[data-sec].dim{opacity:.45}
/* top bar */
html{scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:9px;flex-wrap:nowrap;background-color:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);background-image:linear-gradient(var(--line),var(--line));background-size:100% 1px;background-position:bottom;background-repeat:no-repeat;margin-bottom:10px}
.top .nav{flex-wrap:wrap;justify-content:flex-end}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.logo{width:25px;height:25px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent);overflow:hidden;border:0;padding:0;font:inherit;color:inherit;cursor:default;-webkit-appearance:none;appearance:none}
.logo svg{width:14px;height:14px}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font-family:var(--font-display);font-size:11px;letter-spacing:.06em;display:block;line-height:1.1}
.brand span{font-size:9px;color:var(--muted);display:block;max-width:none;white-space:nowrap}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{text-decoration:none;font-weight:500;font-size:9px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s,color .2s}
.nav a:hover{border-color:var(--red);color:var(--red)}
/* grid */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.main{display:flex;flex-direction:column;gap:56px;min-width:0}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:24px;align-items:center;padding-top:8px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero .eyebrow{color:var(--red)}
.hero h1{font-size:clamp(36px,5.6vw,62px);font-weight:800;margin-top:10px}
.hero h1 em{font-style:normal;display:inline-block;background:var(--red);color:var(--red-ink);padding:0 .16em;border-radius:.18em;transform:rotate(-2deg)}
.hero p.lead{margin-top:16px;color:var(--muted);max-width:46ch;font-size:17px}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-weight:700;font-size:16px;padding:13px 22px;border-radius:var(--rad-btn);text-decoration:none;min-height:48px;transition:transform .15s,box-shadow .2s,filter .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--red);color:var(--red-ink);box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 30%,transparent)}
.btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-ghost:hover{background:var(--blush)}
.cnt{font-variant-numeric:tabular-nums}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.sizes span{padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.sizes span.hot{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.hero-art{position:relative;aspect-ratio:1/1;max-width:100%}
.hero-art::before{content:"";position:absolute;inset:4% 2% 8% 8%;background:var(--red);border-radius:46% 54% 58% 42%/48% 44% 56% 52%}
.hero-art::after{content:"";position:absolute;inset:0 6% 2% 2%;border:2px dashed color-mix(in srgb,var(--brand) 55%,transparent);border-radius:50%}
.hero-photo{position:absolute;z-index:1;inset:8% 8% 12% 12%;width:84%;height:80%;object-fit:cover;border-radius:44% 56% 52% 48%/50% 44% 56% 50%;box-shadow:0 16px 32px color-mix(in srgb,var(--deep) 40%,transparent);border:4px solid var(--surface)}
.pc{position:absolute;z-index:1;box-shadow:0 16px 32px color-mix(in srgb,var(--deep) 36%,transparent);border-radius:4px;overflow:hidden;transform:rotate(var(--r));animation:float 6s ease-in-out infinite;animation-delay:var(--d,0s)}
.pc svg{display:block;width:100%;height:auto}
.pc.has{aspect-ratio:var(--ar);border:4px solid #fff;background:#fff}
.pcimg{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:700px){.brand span{display:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-10px) rotate(var(--r))}}
.price-chip{position:absolute;z-index:2;right:0;bottom:4%;background:var(--chip);color:var(--chip-ink);font-family:var(--font-display);font-weight:800;border-radius:50%;width:104px;height:104px;display:grid;place-items:center;text-align:center;transform:rotate(-10deg);line-height:1;font-size:13px;box-shadow:0 10px 24px color-mix(in srgb,var(--deep) 40%,transparent)}
.price-chip b{display:block;font-size:28px;margin-top:2px}
/* ticker */
.ticker{overflow:hidden;background:var(--red);color:var(--red-ink);border-radius:var(--rad-btn);padding:13px 0}
.track{display:flex;width:max-content;animation:tick 30s linear infinite;font-family:var(--font-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.track span{padding-right:28px;white-space:nowrap}
.track span::after{content:"\2022";padding-left:28px;opacity:.6}
@keyframes tick{to{transform:translateX(-50%)}}
/* section head */
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(26px,3.6vw,36px);font-weight:800}
.sec-head h2::after{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--red);margin-top:10px}
.sec-head p{color:var(--muted);max-width:52ch;margin-top:8px}
/* carousel */
.car-ctl{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s,border-color .2s}
.icon-btn:hover{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.icon-btn svg{width:20px;height:20px}
.car{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 20px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.slide{flex:none;width:min(260px,72vw);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;gap:12px;transition:transform .25s,box-shadow .25s,border-color .25s}
.slide:hover{transform:translateY(-5px);box-shadow:0 16px 30px color-mix(in srgb,var(--brand) 16%,transparent);border-color:var(--red-soft)}
.slide .stage{height:230px;border-radius:calc(var(--rad) - 6px);background:var(--blush);display:grid;place-items:center;overflow:hidden}
.slide .stage svg{max-height:210px;max-width:92%;transition:transform .3s}
.slide .stage.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.slide:hover .stage svg{transform:scale(1.05) rotate(-1.5deg)}
.slide:hover .stage.photo img{transform:scale(1.05)}
.slide h3{font-size:19px;font-weight:700}
.slide .meta{color:var(--muted);font-size:14px;margin-top:2px}
.slide .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.slide .from{font-weight:700;font-size:14px;color:var(--red)}
.pick{border:1.5px solid var(--red);background:transparent;color:var(--red);border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px;min-height:40px;transition:background .2s,color .2s}
.pick:hover{background:var(--red);color:var(--red-ink)}
.hint{font-size:13px;color:var(--muted);margin-top:2px}
/* products */
.prod{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .25s,box-shadow .25s;min-width:0}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 26px color-mix(in srgb,var(--brand) 14%,transparent)}
.card .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--red-soft);color:var(--red)}
.card .ico svg{width:30px;height:30px}
.card .ph{aspect-ratio:4/3;border-radius:calc(var(--rad) - 8px);overflow:hidden;background:var(--blush)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{font-size:19px}
.card p{color:var(--muted);font-size:14.5px}
.card .pick{align-self:flex-start;margin-top:auto}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gal figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:calc(var(--rad) - 6px);border:1px solid var(--line);display:block}
.gal figcaption{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
/* template */
.tabs2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab2{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;transition:background .2s,color .2s,border-color .2s}
.tab2:hover{border-color:var(--red);color:var(--red)}
.tab2.on{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tcard,.slide,.card,.gal figure{position:relative}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .25s,box-shadow .25s}
.tcard:hover{transform:translateY(-4px);box-shadow:0 14px 26px color-mix(in srgb,var(--brand) 14%,transparent)}
.tmedia{aspect-ratio:1/1.1;border-radius:calc(var(--rad) - 8px);background:var(--blush);display:grid;place-items:center;overflow:hidden}
.tmedia svg{width:84%;height:auto;max-height:92%}
.tmedia img{width:100%;height:100%;object-fit:cover;display:block}
.tcard h3{font-size:16px;overflow-wrap:anywhere}
.tcard .pick{margin-top:auto}
/* tombol foto langsung di kartu: hanya mode admin */
.editph,.addtile{display:none}
body.editing .editph{display:inline-flex;position:absolute;top:10px;right:10px;z-index:3;background:var(--red);color:var(--red-ink);font-weight:700;font-size:12px;border-radius:99px;padding:6px 12px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
body.editing .editph:hover{filter:brightness(1.08)}
body.editing .addtile{display:grid;place-items:center;text-align:center;min-height:150px;border:2px dashed var(--red);color:var(--red);border-radius:var(--rad);font-weight:700;padding:14px;cursor:pointer;background:var(--blush)}
body.editing .addtile:hover{background:var(--red-soft)}
/* course ad */
.course{background:var(--block);color:var(--on-block);border-radius:calc(var(--rad) + 10px);padding:clamp(22px,4vw,44px);position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:center}
.course::before{content:"";position:absolute;right:-80px;top:-100px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 68%);pointer-events:none}
.course::after{content:"";position:absolute;left:-70px;bottom:-110px;width:260px;height:260px;border-radius:50%;border:2px solid rgba(255,255,255,.25);pointer-events:none}
.course>*{position:relative;z-index:1;min-width:0}
.tag{display:inline-block;background:#fff;color:var(--deep);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:99px}
.course h2{font-size:clamp(30px,4.6vw,48px);font-weight:800;margin-top:14px}
.course h2 em{font-style:normal;background:#fff;color:var(--deep);padding:0 .14em;border-radius:.16em;display:inline-block;transform:rotate(-1.5deg)}
.course .lead{margin-top:14px;opacity:.92;max-width:48ch}
.ticks{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks svg{flex:none;width:22px;height:22px;margin-top:1px}
.pass{background:var(--surface);color:var(--ink);border-radius:calc(var(--rad) + 2px);padding:22px;transform:rotate(1.6deg);box-shadow:0 22px 44px color-mix(in srgb,var(--deep) 45%,transparent);transition:transform .3s}
.pass:hover{transform:rotate(0) translateY(-3px)}
.pass .eyebrow{color:var(--muted)}
.pass .big{font-family:var(--font-display);font-weight:800;font-size:56px;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums;color:var(--red)}
.pass .once{color:var(--muted);font-size:14px;margin-top:4px}
.steps{list-style:none;margin:16px 0 18px;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:15px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:var(--red-ink);font-weight:700;display:grid;place-items:center;font-size:13px}
.pass .btn{width:100%}
/* accessories */
.acc{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--blush);border:1px solid var(--line);border-radius:calc(var(--rad) + 4px);padding:22px}
.acc .ico{width:56px;height:56px;border-radius:18px;background:var(--red);color:var(--red-ink);display:grid;place-items:center;flex:none}
.acc .ico svg{width:30px;height:30px}
.acc>div:nth-child(2){flex:1 1 240px;min-width:0}
.acc h2{font-size:26px;font-weight:800}
.acc p{color:var(--muted);margin-top:4px}
/* aside */
.aside{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));max-height:calc(100vh - 70px);overflow:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rad) + 4px);padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px color-mix(in srgb,var(--brand) 10%,transparent)}
.panel-body{display:flex;flex-direction:column;gap:14px;padding:0 6px 6px}
.place b{font-family:var(--font-display);font-size:20px;display:block}
.place span{font-size:13px;color:var(--muted)}
.crow{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.crow svg{flex:none;width:20px;height:20px;margin-top:2px;color:var(--red)}
.crow small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.crow .val{overflow-wrap:anywhere}
.hours{font-size:14px;color:var(--muted)}
.panel .btn{width:100%}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:12px;border:1.5px solid var(--line);text-decoration:none;font-weight:700;font-size:14px;background:var(--surface);transition:border-color .2s,color .2s}
.mini:hover{border-color:var(--red);color:var(--red)}
.mini.solid{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.mini.solid:hover{color:var(--red-ink);filter:brightness(1.07)}
.mini svg{width:16px;height:16px}
/* peta Google Maps (iframe) */
.map{position:relative;border-radius:calc(var(--rad) - 4px);overflow:hidden;border:1px solid var(--line);height:240px;background:#FCF6F6}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;min-height:40px;transition:border-color .2s,color .2s,background .2s}
.links a:hover{border-color:var(--red);color:var(--red)}
.links a svg{width:18px;height:18px;flex:none;color:var(--red)}
/* footer */
.foot{margin-top:56px;padding-block:28px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.foot .right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rad) + 4px);padding:28px 24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;box-shadow:0 18px 40px color-mix(in srgb,var(--brand) 10%,transparent)}
.gate-card h2{font-size:26px;font-weight:800}
.gate-card p{color:var(--muted)}
.gate-card .f{width:100%;text-align:left}
.gate-card .row{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.gate-card .row .btn{flex:1 1 120px}
.f input[type=password]{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px;width:100%}
.f input[type=password]:focus{border-color:var(--red);outline:none}
.pathin{margin-top:2px}
/* floating order (mobile) */
.fab{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.fab .btn{width:100%}
/* toast */

.empty{font-size:14px;color:var(--muted);text-align:center;padding:14px;border:1.5px dashed var(--line);border-radius:14px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:var(--bg);display:block;position:relative;transition:border-color .2s,background .2s}

.thumbs figcaption{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:13px;color:var(--muted);background:var(--blush);border-radius:12px;padding:10px 12px}
.sum{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;max-height:200px;overflow:auto;overflow-wrap:anywhere}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 180px}
.msg{font-size:14px;font-weight:700;min-height:20px}
.err{color:var(--red)}
.ok{color:#16914F}
/* ===== mode admin ===== */
body.editing [data-t],body.editing [data-bind]{outline:1.5px dashed color-mix(in srgb,var(--red) 65%,transparent);outline-offset:3px;border-radius:4px;cursor:text}

.adminbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--chip);color:var(--chip-ink);border-radius:18px;padding:10px 12px;box-shadow:0 14px 34px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}

.ab-msg{font-size:13px;font-weight:500;max-width:34ch}

.drawer{position:fixed;z-index:65;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--surface);color:var(--ink);border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}

.dr-head button{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}

.tab{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.drmsg{font-size:13px;font-weight:700;padding:6px 16px 0;min-height:24px}
.dr-body{flex:1;overflow:auto;padding:8px 16px 28px;display:flex;flex-direction:column;gap:14px}
.dr-body h3{font-size:15px;margin-top:6px}

.f{display:flex;flex-direction:column;gap:4px;font-size:13px}
.f>span{font-weight:700}
.f input[type=text],.f input[type=color],.f select,.f textarea{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:38px;width:100%}

.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--red);outline:none}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--red)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}

.li-h{display:flex;align-items:center;justify-content:space-between;gap:8px}

.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);font-size:14px;font-weight:700}

.drawer{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(340px,calc(100vw - 32px));height:38vh;height:38dvh;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding-top:0;padding-right:0;overflow:hidden}

.ab-msg{font-size:10px;line-height:1.35;max-width:none}
.dr-head{padding:7px 10px 4px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}

.dr-head button{font-size:10px;padding:2px 8px;border-radius:7px;border-width:1px;cursor:pointer}
.dr-tabs{gap:4px;padding:3px 10px 6px}
.tab{font-size:10px;padding:3px 9px;border-width:1px}
.drmsg{font-size:10px;padding:2px 10px 0;min-height:14px}
.dr-body{padding:6px 10px 12px;gap:8px}

.f{font-size:10px;gap:3px}

.chk{font-size:10px;gap:6px}

.sws{gap:6px}.sw{width:22px;height:22px}
.li{padding:7px;gap:7px;border-radius:9px}

.rbtns{gap:4px}

.cols2{gap:6px}
.dr-rs{position:absolute;width:16px;height:16px;z-index:3;touch-action:none}

.dr-rs.tl{left:0;top:0;cursor:nwse-resize;background:linear-gradient(315deg,transparent 55%,var(--red) 55%,var(--red) 62%,transparent 62%,transparent 75%,var(--red) 75%,var(--red) 82%,transparent 82%)}

<style id="theme-override">:root{--brand:#D90429;--font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--rad:20px;--rad-btn:14px}</style>

/* ---------- unggah foto ---------- */
function fileToBlob(file,maxSide,png){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var s=Math.min(1,maxSide/Math.max(im.naturalWidth,im.naturalHeight));
      var w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
      var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");
      if(!png){x.fillStyle="#fff";x.fillRect(0,0,w,h)}
      x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error("Foto tidak bisa diproses."))},png?"image/png":"image/jpeg",0.8);
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Berkas ini bukan gambar yang bisa dibaca."))};
    im.src=url;
  });
}
function storeImage(file,o){
  return fileToBlob(file,o.max||1200,!!o.png).then(function(blob){
    return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=function(){rej(new Error("Foto tidak bisa dibaca."))};fr.readAsDataURL(blob)});
  });
}

function handleFile(inp){

  }

  var arr=Array.prototype.slice.call(list);

      if(multi){
        var base=f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").slice(0,40);

      }else setp(S,up,u);

  });

function toHex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ("0"+b.toString(16)).slice(-2)}).join("")}
function cyrb(str){
  var h1=0xdeadbeef,h2=0x41c6ce57;
  for(var i=0;i<str.length;i++){var ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function newSalt(){
  var a=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);
  return toHex(a);
}
function hashPw(pw,salt,algo){
  var can=!!(window.crypto&&crypto.subtle&&window.TextEncoder);
  if(algo==="weak"||(!algo&&!can))return Promise.resolve({algo:"weak",hash:cyrb(salt+pw)});
  if(!can)return Promise.reject(new Error("Browser ini belum bisa memeriksa sandi. Buka halaman lewat https atau localhost."));
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){
    return crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:150000,hash:"SHA-256"},k,256);
  }).then(function(b){return {algo:"pbkdf2",hash:toHex(b)}});
}
var lockUntil=0,fails=0;
function hasPw(){return !!(S.auth&&S.auth.hash)}
function openLogin(){
  var setup=!hasPw();
  $("gate").hidden=false;$("pw").value="";$("pw2").value="";$("gateErr").textContent="";$("gateErr").className="msg";
  $("gt2").textContent=setup?"Buat kata sandi admin":"Masuk admin";
  $("gateMsg").textContent=setup?"Belum ada kata sandi. Buat sekarang, minimal 8 karakter. Sandi ikut tersimpan di index.html setelah Anda mengunduhnya.":"Khusus pengelola situs.";
  $("pw2Wrap").hidden=!setup;
  $("pw").setAttribute("autocomplete",setup?"new-password":"current-password");
  $("gateGo").textContent=setup?"Simpan sandi":"Masuk";
  setTimeout(function(){$("pw").focus()},30);
}
function closeLogin(){$("gate").hidden=true}
function gateErr(t){$("gateErr").textContent=t;$("gateErr").className="msg err"}
function submitLogin(e){
  e.preventDefault();
  var pw=$("pw").value;
  if(Date.now()<lockUntil){gateErr("Terlalu banyak percobaan. Coba lagi beberapa detik lagi.");return}
  if(!hasPw()){
    if(pw.length<8){gateErr("Minimal 8 karakter.");return}
    if(pw!==$("pw2").value){gateErr("Ulangan sandi tidak sama.");return}
    var salt=newSalt();
    hashPw(pw,salt).then(function(r){
      S.auth={salt:salt,hash:r.hash,algo:r.algo};
      closeLogin();enterEdit();dirty=true;saveDraft();
      abMsg("Sandi dibuat. Unduh index.html agar sandi ikut tersimpan.","ok");
    },function(err){gateErr(errText(err))});
    return;
  }
  hashPw(pw,S.auth.salt,S.auth.algo).then(function(r){
    if(r.hash===S.auth.hash){fails=0;closeLogin();enterEdit()}
    else{
      fails++;
      if(fails>=5){lockUntil=Date.now()+30000;fails=0;gateErr("Sandi salah 5 kali. Tunggu 30 detik.")}
      else gateErr("Sandi salah.");
    }
  },function(err){gateErr(errText(err))});
}

  /* tombol foto langsung di halaman (mode admin) */
  document.addEventListener("change",function(e){
    var t=e.target;if(!editing||!t||t.type!=="file"||!t.hasAttribute("data-up"))return;
    if(t.closest&&t.closest("#drBody"))return;
    handleFile(t);
  });
  $("prod").addEventListener("click",function(e){
    var b=e.target.closest("[data-bind]");if(!b||editing)return;var p=S.produk[+b.dataset.p];if(!p)return;
    if(p.act==="order"){openOrder(p.svc)}
    else{var s=svcByName(p.svc);addItem(p.svc,s&&s.types[0]?s.types[0]:p.title,1);toast(p.title+" ditambahkan")}
  });
  $("items").addEventListener("click",function(e){
    var b=e.target.closest("[data-act]");if(!b)return;var i=+b.dataset.i,it=items[i];if(!it)return;
    if(b.dataset.act==="inc")it.qty++;
    else if(b.dataset.act==="dec"){it.qty--;if(it.qty<1)items.splice(i,1)}
    else items.splice(i,1);
    renderItems();
  });
  $("addBtn").onclick=function(){
    if(!$("fType").value){msg("Pilih jenisnya dulu.","err");return}
    addItem($("fSvc").value,$("fType").value,$("fQty").value);
    $("fQty").value=1;msg("Item ditambahkan. Tambahkan lagi atau kirim pesanan.","ok");
  };
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("[data-order]");if(!b)return;
    if(editing){e.preventDefault();return}
    openOrder(b.dataset.order||null);
  });
  $("close").onclick=closeOrder;
  $("ov").addEventListener("click",function(e){if(e.target===$("ov"))closeOrder()});
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&!$("ov").hidden)closeOrder();
    if(editing&&e.key==="Enter"&&e.target.closest&&e.target.closest("[data-t],[data-bind]"))e.preventDefault();
  });
  document.addEventListener("paste",function(e){
    if(!editing)return;var el=e.target.closest&&e.target.closest("[data-t],[data-bind]");if(!el)return;
    e.preventDefault();var t=((e.clipboardData||window.clipboardData).getData("text/plain")||"").replace(/\s+/g," ");
    document.execCommand("insertText",false,t);
  });
  $("fSvc").onchange=function(){fillTypes()};
  ["fName","fNote"].forEach(function(id){$(id).addEventListener("input",summary)});
  $("fFile").addEventListener("change",function(e){showFiles(e.target.files)});
  var drop=$("drop");
  ["dragenter","dragover"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("over")})});
  ["dragleave","drop"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("over")})});
  drop.addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files.length)showFiles(e.dataTransfer.files)});
  $("copy").onclick=function(){if(valid())copyText(summary())};
  $("form").addEventListener("submit",function(e){
    e.preventDefault();if(!valid())return;
    var t=summary(),wa=String(S.contact.wa||"").replace(/\D/g,"");
    if(wa){
      window.open("https://wa.me/"+wa+"?text="+encodeURIComponent(t),"_blank");
      msg("Chat WhatsApp dibuka. Lampirkan fotomu di sana lalu kirim.","ok");
    }else copyText(t);
  });

  $("abPanel").onclick=function(){if($("drawer").hidden)openDrawer();else closeDrawer()};
  $("drClose").onclick=closeDrawer;
  $("abSave").onclick=saveAll;
  $("abExit").onclick=function(){
    var b=$("abExit");
    if(dirty&&!b.getAttribute("data-arm")){
      b.setAttribute("data-arm","1");b.textContent="Keluar sekarang?";
      abMsg("Perubahan belum diunduh. Draf tersimpan di browser ini. Klik sekali lagi untuk keluar.","err");
      setTimeout(function(){b.removeAttribute("data-arm");b.textContent="Keluar"},4000);return;
    }
    b.removeAttribute("data-arm");b.textContent="Keluar";exitEdit();
  };
  document.addEventListener("input",function(){if(editing){dirty=true;saveDraft()}});
  $("abRestore").onclick=function(){
    var d=lsGet(DK);if(!d)return;
    try{
      var ka=S.auth;S=merge(clone(DEFAULT),JSON.parse(d));
      if(!hasPw()&&ka)S.auth=ka;
      normalize();$("abRestore").hidden=true;afterChange(true);abMsg("Draf dipulihkan. Unduh index.html untuk menyimpannya.","ok");
    }catch(e){abMsg("Draf tidak bisa dipulihkan.","err")}
  };
  $("drTabs").addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(!b)return;curTab=b.getAttribute("data-tab");drMsg("");$("drBody").scrollTop=0;renderDrawer()});
  $("drBody").addEventListener("input",onDrInput);
  $("drBody").addEventListener("change",onDrInput);
  $("drBody").addEventListener("click",onDrClick);

  $("logo").addEventListener("click",function(){if(!editing)openLogin()});
  $("loginForm").addEventListener("submit",submitLogin);
  $("gateCancel").onclick=closeLogin;
  $("gate").addEventListener("click",function(e){if(e.target===$("gate"))closeLogin()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("gate").hidden)closeLogin()});
  window.addEventListener("beforeunload",function(e){if(editing&&dirty){e.preventDefault();e.returnValue=""}});
})();
})();
</script>
</body>
</html>
